services:
  database:
    image: postgres:16-alpine
    container_name: tea_database
    restart: unless-stopped
    environment:
      POSTGRES_DB: tea_chain
      POSTGRES_USER: tea_admin
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - tea_chain_distributed_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tea_admin -d tea_chain"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [tea_network]

  backend:
    build: ./backend
    container_name: tea_backend
    restart: unless-stopped
    environment:
      DB_HOST: database
      DB_NAME: tea_chain
      DB_USER: tea_admin
      DB_PASSWORD: ${DB_PASSWORD}
      DB_PORT: 5432
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-this-to-a-long-random-secret-key-please}
    depends_on:
      database:
        condition: service_healthy
    ports: ["5000:5000"]
    networks: [tea_network]

  frontend:
    image: nginx:alpine
    container_name: tea_frontend
    restart: unless-stopped
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [backend]
    ports: ["8080:80"]
    networks: [tea_network]

volumes:
  tea_chain_distributed_data:

networks:
  tea_network:
    driver: bridge

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tea Chain Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f3ed;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            padding: 35px;
            border-radius: 12px;
            width: 320px;
            box-shadow: 0 3px 15px #0002;
        }
        h2 { text-align: center; color: #35634b; }
        dl {
            display: grid;
            grid-template-columns: auto 1fr;
            gap: 10px 16px;
            margin: 20px 0;
        }
        dt { color: #777; }
        dd { margin: 0; font-weight: bold; }
        button {
            box-sizing: border-box;
            width: 100%;
            padding: 12px;
            margin-top: 14px;
            background: #35634b;
            color: white;
            border: 0;
            cursor: pointer;
        }
        #message { text-align: center; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Tea Chain</h2>
        <h3>Dashboard</h3>
        <p id="message">Loading...</p>
        <dl id="info" hidden>
            <dt>Username</dt><dd id="username"></dd>
            <dt>Role</dt><dd id="role"></dd>
            <dt>Branch</dt><dd id="branch"></dd>
            <dt>Expires</dt><dd id="expires"></dd>
        </dl>
        <button onclick="logout()">Logout</button>
    </div>

    <script>
        function logout() {
            localStorage.removeItem("token");
            window.location.href = "/";
        }

        async function loadUser() {
            const token = localStorage.getItem("token");
            if (!token) {
                window.location.href = "/";
                return;
            }

            const message = document.getElementById("message");
            try {
                const response = await fetch("/api/me", {
                    headers: {"Authorization": "Bearer " + token}
                });

                // token 無效或過期：清掉並導回登入頁
                if (response.status === 401) {
                    logout();
                    return;
                }

                const data = await response.json();
                if (!response.ok) {
                    message.textContent = data.error || "Failed to load user";
                    return;
                }

                const user = data.user;
                document.getElementById("username").textContent = user.username;
                document.getElementById("role").textContent = user.role;
                document.getElementById("branch").textContent =
                    user.branch_id === null ? "All branches" : "Branch #" + user.branch_id;
                document.getElementById("expires").textContent =
                    new Date(user.exp * 1000).toLocaleTimeString();

                message.hidden = true;
                document.getElementById("info").hidden = false;
            } catch (error) {
                message.textContent = "Cannot connect to server";
            }
        }

        loadUser();
    </script>
</body>
</html>

<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TeaChain | Quản lý chuỗi cửa hàng</title>
<style>
:root{--green:#176b52;--mint:#eaf5ef;--ink:#19352d;--muted:#71827b;--line:#e5ece8;--bg:#f6f8f6}
*{box-sizing:border-box}body{margin:0;font:15px/1.5 Inter,system-ui,Arial;background:var(--bg);color:var(--ink)}
button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:10px 15px;background:var(--green);color:white;font-weight:650}
button.ghost{background:white;color:var(--green);border:1px solid var(--line)}button:disabled{opacity:.5;cursor:not-allowed}
.login-wrap{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#e8f4ec,#f9faf7)}
.login{background:white;padding:34px;border-radius:22px;width:min(420px,100%);box-shadow:0 15px 50px #163e2b14}
.logo{font-size:25px;font-weight:850;color:var(--green);letter-spacing:-1px}.sub{color:var(--muted);margin:5px 0 24px}
input,select{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:white;margin:6px 0 14px}
label{font-size:13px;font-weight:700;color:#52665e}.hint{font-size:12px;color:var(--muted)}
.app{display:none;min-height:100vh}.sidebar{width:240px;background:#123e32;color:white;position:fixed;inset:0 auto 0 0;padding:24px 16px}
.sidebar .logo{color:#fff;margin:0 10px 28px}.nav{display:grid;gap:7px}.nav button{background:transparent;color:#c7ddd3;text-align:left;font-weight:550}.nav button.active,.nav button:hover{background:#ffffff1b;color:white}
.side-foot{position:absolute;bottom:20px;left:18px;right:18px;color:#c7ddd3;font-size:12px}
main{margin-left:240px;padding:28px;max-width:1500px}.top{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:24px}
h1{font-size:26px;margin:0}h2{font-size:18px;margin:0 0 16px}.muted{color:var(--muted)}.userbox{display:flex;align-items:center;gap:12px}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px;margin-bottom:20px}
.stat,.panel,.branch,.product{background:white;border:1px solid var(--line);border-radius:16px;padding:18px}
.stat small{color:var(--muted)}.stat strong{display:block;font-size:26px;margin-top:7px}
.content-grid{display:grid;grid-template-columns:1.3fr 1fr;gap:16px}
table{border-collapse:collapse;width:100%;font-size:14px}th,td{text-align:left;padding:12px 9px;border-bottom:1px solid var(--line)}th{color:var(--muted);font-size:12px}
.branch-grid,.product-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.branch{cursor:pointer;transition:.15s}.branch:hover{border-color:#82b9a0;transform:translateY(-2px)}.branch .city{color:var(--muted);font-size:13px}.branch strong{display:block;font-size:17px;margin:7px 0}
.pill{display:inline-block;background:var(--mint);color:var(--green);padding:4px 9px;border-radius:99px;font-size:11px;font-weight:750}
.product{display:flex;flex-direction:column;gap:7px}.product .price{font-size:19px;font-weight:800;color:var(--green)}.product button{margin-top:auto}
.toolbar{display:flex;gap:10px;align-items:center;justify-content:space-between;margin:0 0 15px}.toolbar select{max-width:280px;margin:0}
.cart-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);gap:8px}
.qty{display:flex;align-items:center;gap:7px}.qty button{padding:4px 9px}.empty{padding:30px;text-align:center;color:var(--muted)}
.toast{position:fixed;right:20px;bottom:20px;background:#183f32;color:white;padding:13px 18px;border-radius:12px;display:none;z-index:5}
@media(max-width:1000px){.grid{grid-template-columns:repeat(2,1fr)}.branch-grid,.product-grid{grid-template-columns:repeat(2,1fr)}.content-grid{grid-template-columns:1fr}}
@media(max-width:700px){.sidebar{position:static;width:auto;padding:12px}.sidebar .logo{margin:0 8px 10px}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap;padding:8px 10px}.side-foot{display:none}main{margin:0;padding:18px}.top{align-items:flex-start}.grid{grid-template-columns:repeat(2,1fr)}.branch-grid,.product-grid{grid-template-columns:1fr}.userbox{font-size:12px}}
</style></head>
<body>
<div id="loginScreen" class="login-wrap"><div class="login">
 <div class="logo">🍃 TeaChain</div><div class="sub">Nền tảng quản lý chuỗi cửa hàng trà</div>
 <form id="loginForm"><label>Tên đăng nhập</label><input id="username" value="owner" required>
 <label>Mật khẩu</label><input id="password" type="password" value="owner123" required>
 <button style="width:100%">Đăng nhập</button></form>
 <p class="hint">Demo: owner / owner123 · Manager: manager1–manager6 / manager123 · Staff: staff1 / staff123</p>
 <p id="loginError" style="color:#b33"></p>
</div></div>
<div id="app" class="app">
<aside class="sidebar"><div class="logo">🍃 TeaChain</div><div class="nav">
<button class="active" data-page="dashboard">▦ Tổng quan</button><button data-page="branches">⌂ Chi nhánh</button>
<button data-page="menu">☕ Thực đơn</button><button data-page="order">＋ Tạo đơn hàng</button>
<button data-page="revenue">▤ Doanh thu</button><button data-page="orders">▣ Đơn hàng</button>
</div><div class="side-foot">Hệ thống quản lý tập trung<br>6 chi nhánh · Taiwan</div></aside>
<main><div class="top"><div><h1 id="pageTitle">Tổng quan</h1><div class="muted" id="pageSub">Theo dõi hoạt động toàn chuỗi</div></div>
<div class="userbox"><span id="userLabel"></span><button class="ghost" id="logout">Đăng xuất</button></div></div>
<section id="view"></section></main></div>
<div id="toast" class="toast"></div>
<script>
const API='/api';let token=localStorage.getItem('tea_token'),me=null,branches=[],products=[],cart={},selectedBranch=1;
const money=n=>new Intl.NumberFormat('zh-TW',{style:'currency',currency:'TWD',maximumFractionDigits:0}).format(n||0);
const auth=()=>({'Content-Type':'application/json','Authorization':'Bearer '+token});
async function api(path,opts={}){let r=await fetch(API+path,{...opts,headers:{...auth(),...(opts.headers||{})}});let d=await r.json();if(!r.ok)throw Error(d.message||'Có lỗi xảy ra');return d}
function toast(s){let t=document.querySelector('#toast');t.textContent=s;t.style.display='block';setTimeout(()=>t.style.display='none',2600)}
function showLogin(){document.querySelector('#loginScreen').style.display='grid';document.querySelector('#app').style.display='none'}
async function start(){try{me=(await api('/me')).user;branches=(await api('/branches')).branches;document.querySelector('#loginScreen').style.display='none';document.querySelector('#app').style.display='block';document.querySelector('#userLabel').textContent=me.name+' · '+me.role;await go('dashboard')}catch(e){localStorage.removeItem('tea_token');token=null;showLogin()}}
document.querySelector('#loginForm').onsubmit=async e=>{e.preventDefault();try{let d=await fetch(API+'/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.querySelector('#username').value,password:document.querySelector('#password').value})}).then(r=>r.json());if(!d.token)throw Error(d.message||'Đăng nhập thất bại');token=d.token;localStorage.setItem('tea_token',token);await start()}catch(e){document.querySelector('#loginError').textContent=e.message}};
document.querySelector('#logout').onclick=()=>{localStorage.removeItem('tea_token');token=null;showLogin()};
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>go(b.dataset.page));
async function go(page){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));let titles={dashboard:'Tổng quan',branches:'Chi nhánh',menu:'Thực đơn',order:'Tạo đơn hàng',revenue:'Doanh thu',orders:'Đơn hàng'};pageTitle.textContent=titles[page];pageSub.textContent=page==='order'?'Chọn chi nhánh, chọn món và xác nhận đơn': 'Dữ liệu hệ thống TeaChain';try{if(page==='dashboard')await dashboard();if(page==='branches')await branchPage();if(page==='menu')await menuPage();if(page==='order')await orderPage();if(page==='revenue')await revenuePage();if(page==='orders')await ordersPage()}catch(e){view.innerHTML='<div class="panel">'+e.message+'</div>'}}
async function dashboard(){let d=await api('/reports');view.innerHTML=`<div class="grid"><div class="stat"><small>Tổng doanh thu</small><strong>${money(d.total_revenue)}</strong></div><div class="stat"><small>Tổng đơn hàng</small><strong>${d.total_orders}</strong></div><div class="stat"><small>Chi nhánh</small><strong>6</strong></div><div class="stat"><small>Vai trò</small><strong style="font-size:20px">${me.role.toUpperCase()}</strong></div></div><div class="content-grid"><div class="panel"><h2>Doanh thu theo chi nhánh</h2>${tableBranches(d.branches)}</div><div class="panel"><h2>Truy cập nhanh</h2><p class="muted">Chọn một chi nhánh để xem chi tiết, menu và doanh thu.</p><button onclick="go('branches')">Xem 6 chi nhánh</button> <button class="ghost" onclick="go('order')">Tạo đơn hàng</button></div></div>`}
function tableBranches(rows){return `<table><thead><tr><th>Chi nhánh</th><th>Thành phố</th><th>Đơn</th><th>Doanh thu</th></tr></thead><tbody>${rows.map(b=>`<tr><td><b>${b.name}</b></td><td>${b.city}</td><td>${b.order_count}</td><td>${money(b.revenue)}</td></tr>`).join('')}</tbody></table>`}
async function branchPage(){let d=await api('/reports');view.innerHTML=`<div class="branch-grid">${d.branches.map(b=>`<div class="branch" onclick="branchDetail(${b.id})"><span class="pill">${b.city}</span><strong>${b.name}</strong><div class="muted">${b.order_count} đơn hàng</div><h2 style="color:var(--green);margin:12px 0 0">${money(b.revenue)}</h2><small class="muted">Doanh thu · Nhấn để xem chi tiết →</small></div>`).join('')}</div>`}
async function branchDetail(id){selectedBranch=id;let b=branches.find(x=>x.id===id),d=await api('/reports'),r=d.branches.find(x=>x.id===id),p=await api('/products?branch_id='+id),o=await api('/orders?branch_id='+id);view.innerHTML=`<button class="ghost" onclick="go('branches')">← Danh sách chi nhánh</button><div class="grid" style="margin-top:16px"><div class="stat"><small>Chi nhánh</small><strong style="font-size:19px">${b.name}</strong></div><div class="stat"><small>Doanh thu</small><strong>${money(r.revenue)}</strong></div><div class="stat"><small>Đơn hàng</small><strong>${r.order_count}</strong></div><div class="stat"><small>Thành phố</small><strong>${b.city}</strong></div></div><div class="content-grid"><div class="panel"><h2>Menu chi nhánh</h2>${p.products.map(x=>`<div class="cart-row"><span>${x.name} ${x.is_shared?'<span class="pill">Menu chung</span>':'<span class="pill">Món riêng</span>'}</span><b>${money(x.price)}</b></div>`).join('')}</div><div class="panel"><h2>Đơn hàng gần đây</h2>${o.orders.length?o.orders.slice(0,8).map(x=>`<div class="cart-row"><span>#${x.id} · ${new Date(x.created_at).toLocaleString()}</span><b>${money(x.total)}</b></div>`).join(''):'<div class="empty">Chưa có đơn hàng</div>'}</div></div>`}
async function menuPage(){let d=await api('/products');products=d.products;view.innerHTML=`<div class="toolbar"><span class="muted">Menu chung và món đặc trưng của từng chi nhánh</span><select id="menuBranch" onchange="filterMenu(this.value)"><option value="">Tất cả chi nhánh / menu chung</option>${branches.map(b=>`<option value="${b.id}">${b.name}</option>`).join('')}</select></div><div id="menuList" class="product-grid">${productCards(products)}</div>`}
function productCards(rows){return rows.map(p=>`<div class="product"><span class="pill">${p.is_shared?'Menu dùng chung':branches.find(b=>b.id===p.branch_id)?.name||'Món riêng'}</span><b>${p.name}</b><small class="muted">${p.description||''}</small><div class="price">${money(p.price)}</div></div>`).join('')}
async function filterMenu(id){let d=await api('/products'+(id?'?branch_id='+id:''));menuList.innerHTML=productCards(d.products)}
async function orderPage(){let d=await api('/products?branch_id='+selectedBranch);products=d.products;view.innerHTML=`<div class="toolbar"><div><b>Chi nhánh bán hàng</b></div><select id="orderBranch" onchange="changeOrderBranch(this.value)">${branches.map(b=>`<option value="${b.id}" ${b.id===selectedBranch?'selected':''}>${b.name}</option>`).join('')}</select></div><div class="content-grid"><div><h2>Chọn món</h2><div class="product-grid">${products.map(p=>`<div class="product"><span class="pill">${p.is_shared?'Menu chung':'Món riêng'}</span><b>${p.name}</b><small class="muted">${p.description||''}</small><div class="price">${money(p.price)}</div><button onclick="addCart(${p.id})">＋ Thêm vào đơn</button></div>`).join('')}</div></div><div class="panel"><h2>Đơn hàng hiện tại</h2><div id="cartItems">${cartMarkup()}</div><div class="cart-row"><b>Tổng cộng</b><b id="cartTotal">${money(cartTotal())}</b></div><button style="width:100%;margin-top:14px" onclick="submitOrder()" ${Object.keys(cart).length?'':'disabled'}>Xác nhận đơn hàng</button></div></div>`}
function cartTotal(){return Object.values(cart).reduce((s,x)=>s+x.price*x.qty,0)}
function cartMarkup(){let items=Object.values(cart);return items.length?items.map(x=>`<div class="cart-row"><div>${x.name}<br><small>${money(x.price)}</small></div><div class="qty"><button onclick="changeQty(${x.id},-1)">−</button>${x.qty}<button onclick="changeQty(${x.id},1)">＋</button></div></div>`).join(''):'<div class="empty">Chưa chọn món</div>'}
function addCart(id){let p=products.find(x=>x.id===id);if(!cart[id])cart[id]={id:p.id,name:p.name,price:p.price,qty:0};cart[id].qty++;refreshCart()}
function changeQty(id,n){if(!cart[id])return;cart[id].qty+=n;if(cart[id].qty<=0)delete cart[id];refreshCart()}
function refreshCart(){let el=document.querySelector('#cartItems');if(el){el.innerHTML=cartMarkup();cartTotalEl=document.querySelector('#cartTotal');if(cartTotalEl)cartTotalEl.textContent=money(cartTotal());let btn=document.querySelector('.panel button[onclick="submitOrder()"]');if(btn)btn.disabled=!Object.keys(cart).length}}
async function changeOrderBranch(id){selectedBranch=Number(id);cart={};await orderPage()}
async function submitOrder(){try{let d=await api('/orders',{method:'POST',body:JSON.stringify({branch_id:selectedBranch,items:Object.values(cart).map(x=>({product_id:x.id,quantity:x.qty}))})});cart={};toast('Đã tạo đơn #'+d.order_id+' · '+money(d.total));await orderPage()}catch(e){toast(e.message)}}
async function revenuePage(){let d=await api('/reports');view.innerHTML=`<div class="grid"><div class="stat"><small>Doanh thu toàn hệ thống</small><strong>${money(d.total_revenue)}</strong></div><div class="stat"><small>Tổng đơn</small><strong>${d.total_orders}</strong></div></div><div class="panel"><h2>Báo cáo doanh thu 6 chi nhánh</h2>${tableBranches(d.branches)}</div>`}
async function ordersPage(){let d=await api('/orders');view.innerHTML=`<div class="panel"><h2>Đơn hàng gần đây</h2>${d.orders.length?`<table><thead><tr><th>Mã đơn</th><th>Chi nhánh</th><th>Người tạo</th><th>Thời gian</th><th>Tổng tiền</th></tr></thead><tbody>${d.orders.map(o=>`<tr><td>#${o.id}</td><td>${o.branch_name}</td><td>${o.created_by||'-'}</td><td>${new Date(o.created_at).toLocaleString()}</td><td><b>${money(o.total)}</b></td></tr>`).join('')}</tbody></table>`:'<div class="empty">Chưa có đơn hàng</div>'}</div>`}
if(token)start();else showLogin();
</script></body></html>
